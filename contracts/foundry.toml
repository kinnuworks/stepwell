[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
network = "arc"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"

[lint]
lint_on_build = false
